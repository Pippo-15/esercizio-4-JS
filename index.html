<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST JS</title>
</head>
<body>

    <script>
        const num1 = Number(prompt("Inserisci il primo numero"));
        const num2 = Number(prompt("Inserisci il secondo numero"));
        const somma= (num1+num2);
        const sottrazione= (num1-num2);
        const moltiplicazione= (num1*num2);
        const divisione= (num1/num2);
        const potenza= (num1**num2);
        console.log(`Con i numeri da te scelti, i risultati delle varie operazioni sono: somma ${somma}, sottrazione ${sottrazione}, moltiplicazione ${moltiplicazione}, divisione ${divisione}, potenza ${potenza}`)
    </script>
</body>
</html>
